services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    env_file: container/.env
    # Host networking, so Caddy can read the machine's LAN IP for the A record.
    # It listens on 80 and 443 (tcp and udp) directly; see the Containerfile
    # for the sysctl the host needs.
    network_mode: host
    volumes:
      - storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  storage:
  caddy_data:
  caddy_config:
