services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    env_file: container/.env
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  storage:
  caddy_data:
  caddy_config:
