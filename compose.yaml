services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    env_file: container/.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Lets nonroot bind 80/443 inside the container without any capability.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    volumes:
      - storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  storage:
  caddy_data:
  caddy_config:
